# Enterprise Prometheus configuration for CakeCake.
#
# Wired into docker-compose.yml; secrets come from the compose environment
# (METRICS_TOKEN, PROMETHEUS_ENV, PROMETHEUS_CLUSTER) via env expansion.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: ${PROMETHEUS_ENV}
    cluster: ${PROMETHEUS_CLUSTER}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: cakecake-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: cakecake-backend
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: backend:8080
