# Compose Nginx: serves the frontend static assets and proxies /api (incl. WebSocket) to backend
server {
    listen 80;
    server_name _;

    client_max_body_size 520m;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend SPA (hash router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Swagger UI (served by the Go backend via gin-swagger)
    location /swagger/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + WebSocket (danmaku /api/v1/ws/danmaku, chat /api/v1/ws/chat)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
