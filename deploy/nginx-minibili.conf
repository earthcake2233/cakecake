# /etc/nginx/conf.d/minibili.conf
# 将 server_name 改为你的域名，或使用 _ 表示默认站点

server {
    listen 80;
    server_name _;

    client_max_body_size 520m;

    root /opt/minibili/www;
    index index.html;

    # 前端 SPA（Hash 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    
    # Swagger UI（由 Go 后端 gin-swagger 提供服务）
    location /swagger/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Prometheus /metrics（供本地监控栈通过 HTTPS + Bearer 抓取；鉴权由后端 METRICS_TOKEN 强制）
    # 不要把 8080 直接暴露公网，只让这条反代出去。
    location = /metrics {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }
    # API + WebSocket（弹幕 /api/v1/ws/danmaku，聊天 /api/v1/ws/chat）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
