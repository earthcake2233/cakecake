# Gitleaks configuration for cakecake.
# Uses the default rule set, with an allowlist for repo-known placeholders,
# demo credentials and test fixtures (none of these are real secrets).
title = "cakecake gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Repo-known placeholders, demo credentials and test fixtures"
# Match allowlist regexes against the full finding line, so field-style
# patterns like `"new_password":"..."` in test fixtures are ignored.
regexTarget = "line"
regexes = [
  '''demo123456''',
  '''change-me[-_a-z0-9]*''',
  '''请替换''',
  '''password12''',
  '''password123''',
  '''admin123''',
  '''adminpass''',
  '''covma''',
  '''mysecret''',
  '''dskey''',
  '''espass''',
  '''redispass''',
  '''akid''',
  '''aksecret''',
  '''"password":"[^"]*"''',
  '''"old_password":"[^"]*"''',
  '''"new_password":"[^"]*"''',
]
