codecov:
  notify:
    require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: '50...80'

  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: false

    patch:
      default:
        target: 45%
        threshold: 5%
        informational: false

comment:
  layout: 'reach,diff,flags,files,footer'
  behavior: default
  require_changes: false
