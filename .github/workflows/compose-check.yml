# Docker Compose guard: env-drift check + compose syntax validation + full-stack smoke test
# Goal: compose evolves together with .env.example / code; drift fails CI instead of hitting readers.

name: Compose check

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".env.example"
      - "deploy/env.production.example"
      - "Dockerfile"
      - "cakecake-vue/cakecake-web/Dockerfile"
      - "deploy/nginx-compose.conf"
      - "deploy/monitoring/**"
      - ".dockerignore"
      - "scripts/check_compose_env.py"
      - "internal/data/demo_seed*.go"
      - ".github/workflows/compose-check.yml"
  push:
    branches: [main, master]
    paths:
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".env.example"
      - "deploy/env.production.example"
      - "Dockerfile"
      - "cakecake-vue/cakecake-web/Dockerfile"
      - "deploy/nginx-compose.conf"
      - "deploy/monitoring/**"
      - ".dockerignore"
      - "scripts/check_compose_env.py"
      - "internal/data/demo_seed*.go"
      - ".github/workflows/compose-check.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # weekly: verify image/dependency compatibility even without code changes

concurrency:
  group: compose-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate .env with random secrets
        run: python3 scripts/init_env.py

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Validate dev compose override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Env drift check (.env.example <-> compose)
        run: python3 scripts/check_compose_env.py

      - name: Validate monitoring configs
        run: |
          mkdir -p /tmp/cakecake-ci-secrets
          printf 'ci-token' > /tmp/cakecake-ci-secrets/metrics_token
          printf 'ci-token' > /tmp/cakecake-ci-secrets/metrics_token_cloud
          docker run --rm \
            -e METRICS_TOKEN=ci-token \
            -e PROMETHEUS_ENV=ci \
            -e PROMETHEUS_CLUSTER=ci \
            -v "$PWD/deploy/monitoring:/etc/prometheus:ro" \
            -v /tmp/cakecake-ci-secrets:/run/secrets:ro \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/monitoring:/etc/alertmanager:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml
          python3 -m json.tool deploy/monitoring/grafana/dashboards/cakecake-ai-gateway.json >/dev/null

  compose-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF reports to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Raise vm.max_map_count for Elasticsearch (host kernel parameter)
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Build and start full stack
        env:
          WEB_PORT: 18080
          BACKEND_PORT: 18081
          MYSQL_PORT: 13306
          REDIS_PORT: 16379
          RABBITMQ_PORT: 15672
          RABBITMQ_MGMT_PORT: 15673
          ES_PORT: 19200
        run: |
          python3 scripts/init_env.py
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Wait for frontend to serve
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)
            if [ "$code" = "200" ]; then
              echo "frontend ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "frontend did not become ready in 300s"
          exit 1

      - name: Check backend health + seeded demo data
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null 2>&1; then
              echo "backend ready after $((i * 3))s"
              ok=1
              break
            fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "backend never became ready (502 from nginx proxy)"; exit 1; }
          curl -fsS http://127.0.0.1:18080/api/v1/health | grep -Eq '"code"[^0-9]*0'
          curl -fsS "http://127.0.0.1:18080/api/v1/videos?limit=3" | grep -Eq '"code"[^0-9]*0'
          curl -fsS "http://127.0.0.1:18080/api/v1/videos?limit=3" | grep -q '"items"'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18080/ | grep -q '^200$'

      - name: Check monitoring stack is up and dashboard provisioned
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "monitoring stack never became ready"; exit 1; }
          guser=$(sed -n 's/^GRAFANA_ADMIN_USER=//p' .env | head -1)
          gpass=$(sed -n 's/^GRAFANA_ADMIN_PASSWORD=//p' .env | head -1)
          [ -n "$guser" ] || guser=admin
          [ -n "$gpass" ] || { echo "GRAFANA_ADMIN_PASSWORD missing in .env"; exit 1; }
          auth=$(printf '%s:%s' "$guser" "$gpass" | base64 -w0)
          curl -fsS -H "Authorization: Basic $auth" \
            "http://127.0.0.1:3000/api/search?query=CakeCake" | grep -q '"title":"CakeCake AI Gateway"'

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: earthcake/cakecake-backend:latest
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL

      - name: Scan web image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: earthcake/cakecake-web:latest
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL

      - name: Upload backend SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload web SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Teardown
        if: always()
        run: docker compose down -v
