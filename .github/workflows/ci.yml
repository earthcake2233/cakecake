name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cakecake-vue/cakecake-web/package-lock.json

      - name: Install dependencies
        working-directory: cakecake-vue/cakecake-web
        run: npm ci

      - name: Run frontend lint
        working-directory: cakecake-vue/cakecake-web
        run: npm run lint

      - name: Run frontend typecheck (vue-tsc --noEmit)
        working-directory: cakecake-vue/cakecake-web
        run: npx vue-tsc --noEmit -p tsconfig.typecheck.json

      - name: Audit npm dependencies (high+ advisories)
        working-directory: cakecake-vue/cakecake-web
        run: npm audit --audit-level=high

      - name: Run tests with coverage
        working-directory: cakecake-vue/cakecake-web
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: cakecake-vue/cakecake-web/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true
          verbose: true

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        # Pinned to the same version used for local verification. The gate
        # fails on any finding (see .golangci.yml for the linter set).
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --timeout 8m ./internal/... ./cmd/...

      - name: Check exported comments
        # golint is inactivated inside golangci-lint v1.64.8, so exported-comment
        # strictness is enforced with the standalone golint binary, filtered to
        # missing or misformatted exported comments only.
        run: |
          set -o pipefail
          out=$(go run golang.org/x/lint/golint@v0.0.0-20241112194109-818c5a804067 ./internal/... ./cmd/... 2>&1)
          issues=$(printf '%s\n' "$out" | grep -E 'should have comment or be unexported|comment on exported' || true)
          if [ -n "$issues" ]; then
            echo "Exported comments missing or misformatted:"
            printf '%s\n' "$issues"
            exit 1
          fi

      - name: Check dependency directions
        # Layering guard: handler->data, service->handler, client->gorm and
        # model->service/data are forbidden (see scripts/check_deps.sh).
        run: bash scripts/check_deps.sh

      - name: Check goose/GORM migration sync
        # Every GORM model table + column must exist in the goose SQL
        # migrations; prevents the two migration tracks from drifting
        # (see scripts/check_migration_sync.py).
        run: python3 scripts/check_migration_sync.py

      - name: Check handler tests never call srve without assertions
        # Bare srve() smoke calls inflate coverage without verifying behavior.
        # The baseline is tracked in scripts/bare_srve_baseline.txt and must
        # only go down (see scripts/check_bare_srve.py --update).
        run: python3 scripts/check_bare_srve.py

      - name: Run Go tests with coverage
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: |
          go test -tags=integration ./... -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true
          verbose: true

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-mq-integration:
    # 独立门禁：用真实 RabbitMQ broker 跑 queue 包集成测试，并断言"未被跳过"。
    # test-backend 已用 -tags=integration ./... + RABBITMQ_URL 跑全量，这里
    # 单独拎出来做一个可见、可复现的绿色检查，面试可直接引用"CI 里真连 MQ 跑过"。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run real RabbitMQ integration tests (assert not skipped)
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: |
          rc=0
          out=$(go test -tags=integration -v ./internal/queue/... -count=1 2>&1) || rc=$?
          printf '%s\n' "$out"
          skipped=$(printf '%s\n' "$out" | grep -cE '^--- SKIP:' || true)
          passed=$(printf '%s\n' "$out" | grep -cE '^--- PASS:' || true)
          echo "queue integration: rc=$rc passed=$passed skipped=$skipped"
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: go test exited $rc" >&2
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "FAIL: expected real RabbitMQ integration tests to RUN (skipped=$skipped)" >&2
            exit 1
          fi
          if [ "$passed" -eq 0 ]; then
            echo "FAIL: no queue integration test passed" >&2
            exit 1
          fi
