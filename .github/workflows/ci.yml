name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cakecake-vue/cakecake-web/package-lock.json

      - name: Install dependencies
        working-directory: cakecake-vue/cakecake-web
        run: npm ci

      - name: Run tests with coverage
        working-directory: cakecake-vue/cakecake-web
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: cakecake-vue/cakecake-web/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true
          verbose: true

  test-backend:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go tests with coverage
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: |
          go test -tags=integration ./... -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true
          verbose: true
