# cakecake 生产部署（企业规范：CI 通过 → 人工审批 → 自动部署）
#
# 流程：
#   1) 推送 main/master → CI（.github/workflows/ci.yml）自动跑测试；
#   2) CI 成功后本工作流自动启动，进入 production 环境审批门（GitHub 暂停等待批准）；
#   3) 你在 Actions 页面批准后，按 CI 验证过的 commit 构建并部署，失败自动回滚。
#
# GitHub 仓库 Settings → Environments 配置：
#   - 新建环境 production（URL: https://chengzisoft.top）
#   - 开启 Required reviewers 并添加自己，形成人工审批门
#
# Settings → Secrets and variables → Actions 配置：
#   DEPLOY_HOST      服务器 IP 或域名（当前: 47.100.219.13）
#   DEPLOY_USER      SSH 用户名（当前: root）
#   DEPLOY_SSH_KEY   SSH 私钥（PEM 全文）
#   DEPLOY_PORT      可选，默认 22
#
# 服务器需已按 deploy/DEPLOY.md 初始化：
#   /opt/minibili/bin、/opt/minibili/www、/opt/minibili/.env、systemd minibili、Nginx

name: Deploy cakecake

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-minibili
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://chengzisoft.top
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cakecake-vue/cakecake-web/package-lock.json

      - name: Build frontend
        working-directory: cakecake-vue/cakecake-web
        run: |
          cp .env.production.example .env.production
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build backend (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o cakecake-linux ./cmd/cakecake

      - name: Pack release bundle
        run: |
          mkdir -p release/dist release/migrations
          cp cakecake-linux release/cakecake
          cp -a cakecake-vue/cakecake-web/dist/. release/dist/
          cp -a migrations/. release/migrations/
          tar czf minibili-release.tar.gz -C release .

      - name: Upload bundle to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: minibili-release.tar.gz
          target: /tmp
          debug: true

      - name: Install on server and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            WORK=/tmp/minibili-release
            rm -rf "$WORK"
            mkdir -p "$WORK"
            tar xzf /tmp/minibili-release.tar.gz -C "$WORK"
            if [ -f /opt/minibili/bin/mini-bili ]; then
              cp -a /opt/minibili/bin/mini-bili /opt/minibili/bin/mini-bili.prev
            fi
            if [ -d /opt/minibili/migrations ]; then
              rm -rf /opt/minibili/migrations.prev
              mv /opt/minibili/migrations /opt/minibili/migrations.prev
            fi
            install -m 755 "$WORK/cakecake" /opt/minibili/bin/mini-bili
            rm -rf /opt/minibili/www/*
            mkdir -p /opt/minibili/www
            cp -a "$WORK/dist/." /opt/minibili/www/
            mkdir -p /opt/minibili/migrations
            cp -a "$WORK/migrations/." /opt/minibili/migrations/
            rm -rf "$WORK" /tmp/minibili-release.tar.gz
            systemctl restart minibili
            # Wait up to 30s for the app to listen (startup can take a few seconds)
            ok=0
            for _ in $(seq 1 15); do
              sleep 2
              if curl -fsS --max-time 3 http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
                ok=1
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "health check failed, rolling back..." >&2
              systemctl stop minibili || true
              sleep 1
              if [ -f /opt/minibili/bin/mini-bili.prev ]; then
                install -m 755 /opt/minibili/bin/mini-bili.prev /opt/minibili/bin/mini-bili
              fi
              rm -rf /opt/minibili/migrations
              if [ -d /opt/minibili/migrations.prev ]; then
                mv /opt/minibili/migrations.prev /opt/minibili/migrations
              fi
              systemctl start minibili || true
              sleep 3
              curl -fsS --max-time 5 http://127.0.0.1:8080/api/v1/health || true
              exit 1
            fi
            nginx -t
            nginx -s reload
            curl -fsS http://127.0.0.1:8080/api/v1/health | head -c 200
            echo
            echo "cakecake deploy OK"
