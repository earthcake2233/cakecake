# Monitoring-only stack for local development when backend/frontend run on the
# host (air / npm). Do NOT run together with the full docker-compose.yml stack.
#
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d
#   open http://127.0.0.1:3000 (Grafana, credentials from .env)
#
# Prometheus scrapes host.docker.internal:8080 so `air`-started backends work
# without changing the full-stack compose file.
name: cakecake-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cakecake-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROMETHEUS_ENV: ${APP_ENV:-development}
      PROMETHEUS_CLUSTER: ${PROMETHEUS_CLUSTER:-default}
    secrets:
      - metrics_token
      - metrics_token_cloud
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus-host.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cakecake-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:${ALERTMANAGER_PORT:-9093}
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cakecake-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-3000}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

secrets:
  metrics_token:
    file: .secrets/metrics_token
  metrics_token_cloud:
    file: .secrets/metrics_token_cloud
