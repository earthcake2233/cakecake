basePath: /api/v1
host: localhost:8080
info:
  contact:
    name: earthcake2233
    url: https://github.com/earthcake2233
  description: Mini-Bili - 轻量级弹幕视频分享平台后端 API
  license:
    name: Custom Non-Commercial License
    url: https://github.com/earthcake2233/cakecake/blob/main/LICENSE
  termsOfService: https://github.com/earthcake2233/cakecake/blob/main/LICENSE
  title: Mini-Bili API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate and get JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh JWT access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /health:
    get:
      description: Server health check endpoint
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - System
  /home-banners:
    get:
      description: Get active home page banners
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List home banners
      tags:
      - Home
  /hot-search:
    get:
      description: Get current hot search list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List hot searches
      tags:
      - Search
  /search:
    get:
      description: Search videos, users, articles across the platform
      parameters:
      - description: Search keyword
        in: query
        name: keyword
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Unified search
      tags:
      - Search
  /space/{userId}:
    get:
      description: Get user public space by user ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get user public profile
      tags:
      - Users
  /stats/home:
    get:
      description: Get home page statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Home page stats
      tags:
      - Home
  /users:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User credentials
        in: body
        name: body
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Register new user
      tags:
      - Auth
  /users/me:
    get:
      description: Get authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get current user profile
      tags:
      - Users
  /videos:
    get:
      description: Get paginated list of published videos
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Video zone slug
        in: query
        name: zone
        type: string
      - description: Sort field (created_at,play_count)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List published videos
      tags:
      - Videos
  /videos/{id}:
    get:
      description: Get detailed video info by ID
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get video detail
      tags:
      - Videos
  /videos/{id}/comments:
    get:
      description: Get paginated comments for a video
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - default: hot
        description: Sort (hot,time)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List video comments
      tags:
      - Comments
  /videos/{id}/danmaku:
    post:
      consumes:
      - application/json
      description: Post a danmaku (bullet comment) on a video
      parameters:
      - description: Video ID
        in: path
        name: id
        required: true
        type: integer
      - description: Danmaku data
        in: body
        name: body
        required: true
        schema:
          properties:
            color:
              type: string
            content:
              type: string
            position:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Post a danmaku
      tags:
      - Danmaku
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: JWT Bearer token, e.g. "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
