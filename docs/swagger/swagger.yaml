basePath: /api/v1
host: localhost:8080
info:
  contact:
    name: earthcake2233
    url: https://github.com/earthcake2233
  description: Mini-Bili - 轻量级弹幕视频分享平台后端 API
  license:
    name: Custom Non-Commercial License
    url: https://github.com/earthcake2233/cakecake/blob/main/LICENSE
  termsOfService: https://github.com/earthcake2233/cakecake/blob/main/LICENSE
  title: Mini-Bili API
  version: "1.0"
paths:
  /api/v1/ws/danmaku:
    get:
      description: WebSocket endpoint for real-time danmaku messages
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      summary: 'WebSocket: danmaku stream'
      tags:
      - WebSocket
  /articles/{id}:
    get:
      description: Get full article content by ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get article detail
      tags:
      - Articles
  /articles/{id}/comments:
    get:
      description: Get paginated comments for an article
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - default: hot
        description: Sort (hot,time)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List article comments
      tags:
      - Articles
  /articles/{id}/view:
    post:
      description: Increment the view count for an article
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Record article view
      tags:
      - Articles
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate and get JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh JWT access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Auth
  /comments/{id}:
    delete:
      description: Soft-delete a comment (uploader or its author)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete a comment
      tags:
      - Comments
  /comments/{id}/approve:
    post:
      description: Mark a comment as approved (uploader only)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Approve a curated comment
      tags:
      - Comments
  /comments/{id}/dislike:
    post:
      description: Toggle dislike status on a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Dislike/undislike a comment
      tags:
      - Comments
  /comments/{id}/ignore-curated:
    post:
      description: Remove a comment from the curation review queue
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Ignore curated comment
      tags:
      - Comments
  /comments/{id}/like:
    post:
      description: Toggle like status on a comment
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Like/unlike a comment
      tags:
      - Comments
  /comments/{id}/pin:
    post:
      description: Toggle pin status for a comment (uploader only)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      summary: Pin/unpin a comment
      tags:
      - Comments
  /dm/conversations:
    get:
      description: Get all direct message conversations for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List DM conversations
      tags:
      - DM
    post:
      description: Start a new direct message conversation with another user
      parameters:
      - description: Other participant user ID
        in: body
        name: body
        required: true
        schema:
          properties:
            participant_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Create a DM conversation
      tags:
      - DM
  /dm/conversations/{id}:
    delete:
      description: Remove a direct message conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a DM conversation
      tags:
      - DM
  /dm/conversations/{id}/messages:
    get:
      description: Get paginated messages for a DM conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List messages in a conversation
      tags:
      - DM
    post:
      description: Post a new message to a DM conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Message content
        in: body
        name: body
        required: true
        schema:
          properties:
            content:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Send a message in a conversation
      tags:
      - DM
  /dm/conversations/{id}/reset:
    post:
      description: Clear the conversation history for an AI agent DM
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Reset AI agent conversation
      tags:
      - DM
  /dm/conversations/{id}/settings:
    patch:
      description: Update settings (e.g. agent config) for a conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Settings
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update DM conversation settings
      tags:
      - DM
  /health:
    get:
      description: Server health check endpoint
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - System
  /home-banners:
    get:
      description: Get active home page banners
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List home banners
      tags:
      - Home
  /hot-search:
    get:
      description: Get current hot search list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List hot searches
      tags:
      - Search
  /notifications:
    get:
      description: Get paginated list of notifications for the current user
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by category
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List notifications
      tags:
      - Notifications
  /notifications/{id}:
    delete:
      description: Remove a notification from the user inbox
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a notification
      tags:
      - Notifications
  /notifications/{id}/comment-like:
    post:
      description: Toggle like status on a comment via notification
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Like/unlike notification comment
      tags:
      - Notifications
  /notifications/{id}/comment-reply:
    post:
      description: Post a reply to a comment from the notification
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      - description: Reply content
        in: body
        name: body
        required: true
        schema:
          properties:
            content:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Reply to a comment via notification
      tags:
      - Notifications
  /notifications/{id}/like-likers:
    get:
      description: Get users who liked a comment that generated this notification
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List likers of a notification
      tags:
      - Notifications
  /notifications/{id}/mute-likes:
    post:
      description: Stop receiving like notifications for a comment
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Mute like notifications
      tags:
      - Notifications
  /notifications/{id}/read:
    patch:
      description: Mark a single notification as read
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Mark notification as read
      tags:
      - Notifications
  /notifications/read-batch:
    patch:
      description: Mark a batch of notification IDs as read
      parameters:
      - description: Notification IDs
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Mark multiple notifications as read
      tags:
      - Notifications
  /notifications/read-by-category:
    patch:
      description: Mark all notifications in a category as read
      parameters:
      - description: Category to mark read
        in: body
        name: body
        required: true
        schema:
          properties:
            category:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Mark notification category as read
      tags:
      - Notifications
  /notifications/unread-summary:
    get:
      description: Returns count of unread notifications grouped by category
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get unread notification summary
      tags:
      - Notifications
  /search:
    get:
      description: Search videos, users, articles across the platform
      parameters:
      - description: Search keyword
        in: query
        name: keyword
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Unified search
      tags:
      - Search
  /search/suggest:
    get:
      description: Get auto-complete suggestions for search queries
      parameters:
      - description: Search prefix
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Search suggestions
      tags:
      - Search
  /space/{userId}:
    get:
      description: Get user public space by user ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get user public profile
      tags:
      - Users
  /space/{userId}/article-favorites:
    get:
      description: Get paginated article favorites for a user space
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List user article favorites
      tags:
      - Articles
  /space/{userId}/articles:
    get:
      description: Get paginated published articles for a user space
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List user articles
      tags:
      - Articles
  /space/{userId}/dynamics:
    get:
      description: Get paginated dynamics for a user space
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List user dynamics
      tags:
      - Dynamics
  /space/{userId}/videos:
    get:
      description: Get paginated published videos for a user space
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List user videos
      tags:
      - Users
  /stats/home:
    get:
      description: Get home page statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Home page stats
      tags:
      - Home
  /user-dynamics/{id}:
    get:
      description: Get full content of a dynamic post
      parameters:
      - description: Dynamic ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get dynamic detail
      tags:
      - Dynamics
  /user-dynamics/{id}/comments:
    get:
      description: Get paginated comments for a dynamic
      parameters:
      - description: Dynamic ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - default: hot
        description: Sort (hot,time)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List dynamic comments
      tags:
      - Dynamics
  /users:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User credentials
        in: body
        name: body
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Register new user
      tags:
      - Auth
  /users/{userId}/block:
    post:
      description: Toggle block status for a user
      parameters:
      - description: User ID to block/unblock
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Block/unblock a user
      tags:
      - Users
  /users/me:
    get:
      description: Get authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get current user profile
      tags:
      - Users
  /users/me/favorite-folders:
    get:
      description: Get all favorite folders for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List my favorite folders
      tags:
      - Favorites
    post:
      description: Create a new folder for organizing favorites
      parameters:
      - description: Folder name
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Create a favorite folder
      tags:
      - Favorites
  /users/me/favorite-folders/{folderId}:
    delete:
      description: Remove a favorite folder (favorites inside are ungrouped)
      parameters:
      - description: Folder ID
        in: path
        name: folderId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a favorite folder
      tags:
      - Favorites
    put:
      description: Update the name of a favorite folder
      parameters:
      - description: Folder ID
        in: path
        name: folderId
        required: true
        type: integer
      - description: New folder name
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update a favorite folder
      tags:
      - Favorites
  /users/me/favorite-folders/{folderId}/batch-remove:
    post:
      description: Remove multiple videos from a favorite folder at once
      parameters:
      - description: Folder ID
        in: path
        name: folderId
        required: true
        type: integer
      - description: Video IDs to remove
        in: body
        name: body
        required: true
        schema:
          properties:
            video_ids:
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Batch remove videos from folder
      tags:
      - Favorites
  /users/me/favorite-folders/{folderId}/invalid-favorites:
    delete:
      description: Remove references to deleted videos from a folder
      parameters:
      - description: Folder ID
        in: path
        name: folderId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Clear invalid favorites in folder
      tags:
      - Favorites
  /users/me/follow-groups:
    get:
      description: Get all follow groups for current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List my follow groups
      tags:
      - Users
    post:
      description: Create a new group to organize followed users
      parameters:
      - description: Group name
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
